name: Tide
description: >-
  Tide is a UK business finance and administration platform ("built by business
  owners for business owners") serving over two million small businesses, sole
  traders, freelancers, and limited companies. It combines a business current
  account (an e-money account powered by ClearBank), expense cards, invoicing and
  payment tools (Tap to Pay, card readers, QR codes, payment links), MTD-ready
  accounting and admin, business credit and finance (loans, asset finance,
  invoice finance), company formation, and business insurance. Tide is authorised
  and regulated in relation to its regulated activities by the UK Financial
  Conduct Authority. Tide was surfaced as a portfolio company of Anthemis,
  Creandum, and Speedinvest. It does not currently publish a public developer API
  or developer portal; "Open Banking" is offered as a consumer product feature.
